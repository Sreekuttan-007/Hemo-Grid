[project]
name = "hemogrid-model"
version = "0.1.0"
description = "HemoGrid computation engine: forecasting, expiry-risk allocation, and surplus-to-need matching for a blood network."
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "ortools",
    "xgboost",
    "scikit-learn",
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hemogrid_model*"]
